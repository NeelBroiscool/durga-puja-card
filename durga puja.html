<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>শুভ দুর্গাপূজা</title>
  <style>
    :root{
      --bg1:#fff7ef;
      --bg2:#ffe9ee;
      --card:#fffaf5;
      --accent:#a11d1d;
      --accent-2:#e85454;
      --text:#2b1b1b;
      --muted:#5c4b4b;
      --line:rgba(0,0,0,0.08);
      --shadow: 0 16px 36px rgba(121, 28, 28, 0.18);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg, var(--bg1), var(--bg2));
      font-family: "Noto Sans Bengali", "Segoe UI", Arial, sans-serif;
      padding:24px;
    }

    .card{
      width: 920px;
      max-width: 96%;
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.04);
      display:grid;
      grid-template-columns: 1.5fr 0.9fr;
      gap: 22px;
      padding: 28px;
    }

    .main{
      display:flex;
      flex-direction:column;
      gap: 14px;
    }

    .title{
      margin:0;
      font-size: 30px;
      color: var(--accent);
      font-weight: 800;
      letter-spacing:0.3px;
    }

    .subtitle{
      color: var(--muted);
      font-size: 14px;
      margin-top:-4px;
    }

    .image{
      width:100%;
      height:240px;
      object-fit:cover;
      border-radius: 14px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    }

    .message{
      background: linear-gradient(180deg, rgba(255,255,255,0.88), rgba(255,255,255,0.96));
      border:1px dashed rgba(161,29,29,0.25);
      border-radius: 14px;
      padding: 18px 20px;
      line-height: 1.75;
      color: var(--text);
      min-height: 220px;
      font-size: 18px;
    }

    .message p{
      margin:0 0 12px 0;
    }

    .signature{
      display:flex;
      justify-content:space-between;
      align-items:center;
      color: var(--muted);
      font-size: 14px;
      margin-top:4px;
    }

    .sidebar{
      display:flex;
      flex-direction:column;
      gap: 14px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .field label{
      font-size: 13px;
      color:#3b2b2b;
      font-weight:600;
    }

    .field input{
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 15px;
      outline:none;
    }

    .field input:focus{
      border-color: rgba(161,29,29,0.35);
      box-shadow: 0 0 0 3px rgba(161,29,29,0.08);
    }

    .controls{
      display:flex;
      gap:10px;
      margin-top:6px;
    }

    button{
      border:none;
      border-radius: 10px;
      padding: 11px 14px;
      cursor:pointer;
      font-weight:700;
      transition: transform .15s ease, box-shadow .15s ease;
      font-size: 14px;
    }

    button:hover{
      transform: translateY(-1px);
    }

    .convert-btn{
      flex:1;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color:white;
      box-shadow:0 10px 18px rgba(161,29,29,0.2);
    }

    .preview-btn{
      flex:1;
      background:#fff;
      color: var(--accent);
      border: 1px solid rgba(161,29,29,0.12);
    }

    .reveal-box{
      background:linear-gradient(180deg,#fff0f0,#fff9f9);
      border:1px solid rgba(161,29,29,0.10);
      border-radius: 12px;
      padding: 14px 12px;
      min-height: 96px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
      user-select:none;
      cursor:pointer;
    }

    .reveal-box strong{
      display:block;
      color: var(--accent);
      font-size: 22px;
      margin-bottom:6px;
    }

    .reveal-hint{
      font-size: 12px;
      color: var(--muted);
      line-height:1.5;
    }

    .link-area{
      display:none;
      margin-top:12px;
      flex-direction:column;
      gap:8px;
    }

    .link-area.show{
      display:flex;
    }

    .greeting-link{
      display:inline-block;
      color:white;
      background: linear-gradient(135deg, #d13d3d, #ff8660);
      text-decoration:none;
      padding: 10px 12px;
      border-radius: 10px;
      font-weight:700;
      text-align:center;
      box-shadow: 0 10px 18px rgba(209,61,61,0.2);
    }

    .small{
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 820px){
      .card{
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
